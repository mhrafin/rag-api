services:
  app:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres_db}
      - AUTH_SECRET=${AUTH_SECRET}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TEMP_DIR=${TEMP_DIR:-temp/}
      - COST_PER_MILLION=${COST_PER_MILLION:-0.02}
      - MAX_CONTEXT_STRING_TOKEN=${MAX_CONTEXT_STRING_TOKEN:-10000}
    ports:
      - 8000:8000
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: [ "uv", "run", "python", "-m", "src.worker_main" ]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres_db}
      - AUTH_SECRET=${AUTH_SECRET}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TEMP_DIR=${TEMP_DIR:-temp/}
      - COST_PER_MILLION=${COST_PER_MILLION:-0.02}
      - MAX_CONTEXT_STRING_TOKEN=${MAX_CONTEXT_STRING_TOKEN:-10000}
      - WORKER_POLL_INTERVAL=${WORKER_POLL_INTERVAL:-5.0}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build: .
    command: [ "uv", "run", "alembic", "upgrade", "head" ]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres_db}
      - AUTH_SECRET=${AUTH_SECRET}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres_db}
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql

  adminer:
    image: adminer
    ports:
      - 8080:8080
    depends_on:
      - db

volumes:
  pgdata:
